<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trust Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Schibsted+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ===== INTRO ANIMATION STYLES (from Animation Claude 2.0) ===== */
:root{
  --bg:#E3E6DD; --text:#1B2B3B; --ink:#24425E; --badge-fill:#F4F6F0; --line:rgba(36,66,94,.35);
  --font-intro:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1E16; --text:#E6ECF4; --ink:#9DB8DD; --badge-fill:#2A312F; --line:rgba(157,184,221,.40);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1E16; --text:#E6ECF4; --ink:#9DB8DD; --badge-fill:#2A312F; --line:rgba(157,184,221,.40);
}

#introScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-intro);
  transition: background .3s, color .3s;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 2rem 1rem 5rem;
}
#introScreen.hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.intro-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.intro-iconwrap {
  position: relative;
  width: clamp(200px, 42vmin, 320px);
  aspect-ratio: 1;
}
.intro-icon {
  position: relative;
  width: 100%;
  height: 100%;
  display: block;
  color: var(--ink);
}
.intro-pulse {
  position: absolute;
  inset: 14.5%;
  border-radius: 50%;
  border: 2px solid var(--ink);
  opacity: 0;
}
.intro-word {
  overflow: hidden;
  padding: .05em .1em .12em;
}
.intro-word span {
  display: block;
  font-weight: 800;
  font-size: clamp(2.7rem, 10vw, 4.6rem);
  letter-spacing: -.035em;
  line-height: 1;
}
.intro-badge {
  display: inline-flex;
  align-items: center;
  gap: .7rem;
  margin-top: .6rem;
  padding: .7rem 1.3rem .7rem 1rem;
  border: 3px solid var(--ink);
  border-radius: 7px;
  background: var(--badge-fill);
  color: var(--ink);
  transform: rotate(-5deg);
  font-weight: 800;
  font-size: clamp(.9rem, 3.6vw, 1.3rem);
  letter-spacing: .07em;
  text-transform: uppercase;
  white-space: nowrap;
}
.intro-badge svg {
  width: 1.35em;
  height: 1.35em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.intro-mark {
  stroke-dasharray: 1;
}

@media (prefers-reduced-motion: no-preference){
  .intro-run .intro-mark { animation: intro-draw var(--t, .5s) cubic-bezier(.6,.05,.2,1) var(--d, 0s) backwards; }
  .intro-run .intro-inner { animation: intro-fade .6s ease-out 1.1s backwards; }
  .intro-run .intro-dots { transform-box: fill-box; transform-origin: center; animation: intro-dots 1.1s cubic-bezier(.2,.8,.2,1) 1.2s backwards; }
  .intro-run .intro-thud { transform-origin: 256px 256px; animation: intro-thud .38s ease-out 2s; }
  .intro-run .intro-pulse { animation: intro-pulse .95s ease-out 2s; }
  .intro-run .intro-word span { animation: intro-rise .65s cubic-bezier(.2,.8,.2,1) 2.1s backwards; }
  .intro-run .intro-badge { animation: intro-stamp .5s cubic-bezier(.3,1.2,.5,1) 2.7s backwards; }
  .intro-run .intro-badge .intro-mark { --d: 3.05s; --t: .4s; }
}
@keyframes intro-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes intro-fade { from { opacity: 0; } }
@keyframes intro-dots { from { opacity: 0; transform: rotate(-40deg); } }
@keyframes intro-thud { 0%, 100% { transform: scale(1); } 40% { transform: scale(.94); } }
@keyframes intro-pulse { from { opacity: .55; transform: scale(1); } to { opacity: 0; transform: scale(1.5); } }
@keyframes intro-rise { from { transform: translateY(110%); } }
@keyframes intro-stamp {
  from { opacity: 0; transform: rotate(-10deg) scale(1.7); }
  60% { opacity: 1; transform: rotate(-5deg) scale(.96); }
}

/* ===== APP STYLES (from TrustMe 1.0.4) ===== */
:root{
  --paper:#E9EBE3; --paper-2:#F3F4EE; --card:#FFFFFF;
  --ink:#1B2015; --ink-2:#4A5140; --ink-3:#7A8170;
  --rule:#CFD3C4; --rule-2:#DDE0D5;
  --stamp:#24425E; --stamp-soft:#24425E1A;
  --khaki:#8E7A42; --khaki-soft:#8E7A4218;
  --clay:#96442A; --clay-soft:#96442A18;
  --olive:#4A5233;
  --shadow:0 1px 0 #CFD3C4, 0 8px 24px -16px #1B201540;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141810; --paper-2:#1C2117; --card:#212719;
    --ink:#E8EADF; --ink-2:#AFB6A3; --ink-3:#7C8471;
    --rule:#333A28; --rule-2:#2A3020;
    --stamp:#8FB6DC; --stamp-soft:#8FB6DC1F;
    --khaki:#C9B274; --khaki-soft:#C9B27418;
    --clay:#D98A66; --clay-soft:#D98A6618;
    --olive:#9FAE7C;
    --shadow:0 1px 0 #2A3020, 0 8px 24px -16px #000000A0;
  }
}
:root[data-theme="dark"]{
  --paper:#141810; --paper-2:#1C2117; --card:#212719;
  --ink:#E8EADF; --ink-2:#AFB6A3; --ink-3:#7C8471;
  --rule:#333A28; --rule-2:#2A3020;
  --stamp:#8FB6DC; --stamp-soft:#8FB6DC1F;
  --khaki:#C9B274; --khaki-soft:#C9B27418;
  --clay:#D98A66; --clay-soft:#D98A6618;
  --olive:#9FAE7C;
  --shadow:0 1px 0 #2A3020, 0 8px 24px -16px #000000A0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Karla,'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--stamp);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.phone{width:100%;max-width:412px;background:var(--paper-2);border:1px solid var(--rule);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;height:min(860px,calc(100vh - 48px));position:relative;box-shadow:0 40px 80px -40px #1B201566}
@media (max-width:480px){ .stage{padding:0} .phone{border:0;border-radius:0;height:100vh;max-width:none} }
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;font-size:11px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.view{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 28px}
.view::-webkit-scrollbar{width:0}

h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Karla,sans-serif;font-weight:600;letter-spacing:-.02em;margin:0}
h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.035em}
h2{font-size:20px;line-height:1.2}
h3{font-size:16px;line-height:1.25}
p{margin:0 0 12px}
.lede{color:var(--ink-2);font-size:15px;max-width:34ch}
.small{font-size:13px;color:var(--ink-2)}
.tiny{font-size:11.5px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.seal{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--stamp);color:var(--stamp);padding:3px 8px 2px;border-radius:3px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.04em;transform:rotate(-2.5deg);background:var(--stamp-soft);white-space:nowrap}
.seal svg{width:11px;height:11px;flex:none}
.seal.lg{font-size:13px;padding:6px 12px 5px;border-width:2px;transform:rotate(-3deg);gap:7px}
.seal.lg svg{width:15px;height:15px}
.seal.pending{border-color:var(--khaki);color:var(--khaki);background:var(--khaki-soft);transform:rotate(1.5deg)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:12px;background:var(--ink);color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.quiet{background:transparent;color:var(--ink-2);font-weight:500;padding:12px}
.btn.stamp{background:var(--stamp);color:#fff}
:root[data-theme="dark"] .btn.stamp{color:#0E1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.stamp{color:#0E1620}}
.btn.danger{background:transparent;color:var(--clay);border:1px solid var(--clay)}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:9px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

.card{background:var(--card);border:1px solid var(--rule-2);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:flex-start}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.divide{border-top:1px solid var(--rule-2);margin:16px 0}
.stack>*+*{margin-top:10px}

.avatar{width:46px;height:46px;border-radius:11px;flex:none;background:var(--khaki-soft);border:1px solid var(--rule-2);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:17px;color:var(--khaki)}
.avatar.big{width:68px;height:68px;border-radius:16px;font-size:24px}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);font-size:13px;color:var(--ink-2);background:var(--card);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 2px;margin:0 -20px;scrollbar-width:none}
.scroller::-webkit-scrollbar{height:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tile{background:var(--card);border:1px solid var(--rule-2);border-radius:13px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:7px;min-height:88px;justify-content:space-between}
.tile .ico{font-size:19px;line-height:1}
.tile .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:14px}
.tile .ct{font-size:11.5px;color:var(--ink-3)}
.tile .ct.thin{color:var(--clay)}

.prog{display:flex;gap:5px;padding:12px 0 18px}
.prog i{height:3px;flex:1;border-radius:2px;background:var(--rule)}
.prog i.on{background:var(--stamp)}

.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--rule);background:var(--card)}
.field textarea{resize:vertical;min-height:70px}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3)}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:100%;aspect-ratio:1/1.15;text-align:center;font-size:22px;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;border:1px solid var(--rule);border-radius:12px;background:var(--card);font-variant-numeric:tabular-nums}

.esc{display:flex;align-items:center;gap:0;margin:14px 0 6px}
.esc .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--rule);flex:none;background:var(--card)}
.esc .dot.done{background:var(--stamp);border-color:var(--stamp)}
.esc .dot.now{border-color:var(--stamp);box-shadow:0 0 0 4px var(--stamp-soft)}
.esc .bar{height:2px;flex:1;background:var(--rule)}
.esc .bar.done{background:var(--stamp)}
.esclabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}

.rev{border-top:1px solid var(--rule-2);padding-top:12px;margin-top:12px}
.stars{color:var(--khaki);font-size:12px;letter-spacing:1px}

.tabbar{flex:none;display:flex;border-top:1px solid var(--rule);background:var(--paper-2);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10.5px;color:var(--ink-3);border-radius:10px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar svg{width:21px;height:21px;stroke-width:1.7;fill:none;stroke:currentColor}
.tabbar button[aria-current="page"] svg{stroke-width:2.2}

.banner{border:1px solid var(--stamp);background:var(--stamp-soft);border-radius:13px;padding:14px;margin-bottom:14px}
.banner.warn{border-color:var(--clay);background:var(--clay-soft)}
.banner.wait{border-color:var(--khaki);background:var(--khaki-soft)}

.empty{text-align:center;padding:34px 16px;border:1px dashed var(--rule);border-radius:14px}

.hdr{padding:14px 0 12px;display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:9px;border:1px solid var(--rule);display:grid;place-items:center;flex:none}
.back svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}

.toast{position:absolute;left:16px;right:16px;bottom:78px;z-index:50;background:var(--ink);color:var(--paper);padding:13px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 12px 32px -12px #000000A0}
.sheet{position:absolute;inset:0;z-index:60;background:#000000A0;display:flex;align-items:flex-end}
.lightbox{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.lightbox-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px;display:grid;place-items:center;border:none}
.avatar.clickable{cursor:pointer}
.sheet>div{background:var(--paper-2);width:100%;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);max-height:88%;overflow-y:auto}
.grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 16px}

.themetoggle{position:absolute;top:8px;right:14px;z-index:40;width:30px;height:30px;border-radius:8px;border:1px solid var(--rule);display:grid;place-items:center;background:var(--card);color:var(--ink-2)}
.themetoggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

.pricepill{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--ink-3)}
.dist{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.link{color:var(--stamp);text-decoration:underline;text-underline-offset:2px}

/* chat */
.chatwrap{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.bubble{max-width:80%;padding:10px 13px;border-radius:15px;font-size:13.5px;line-height:1.4;position:relative;touch-action:pan-y;will-change:transform}
.bubble.me{background:var(--ink);color:var(--paper);margin-left:auto;border-bottom-right-radius:4px}
.bubble.them{background:var(--card);border:1px solid var(--rule-2);margin-right:auto;border-bottom-left-radius:4px}
.bubble.armed{box-shadow:0 0 0 2px var(--stamp) inset}
.bubble .quote{font-size:11.5px;opacity:.72;border-left:2px solid currentColor;padding:3px 8px;margin-bottom:6px;border-radius:4px;background:rgba(127,127,127,.14)}
.bubble .msgimg{max-width:100%;border-radius:10px;display:block;margin-top:2px}
.bubble .msgtext{margin-top:6px}
.bubble .msgtext:first-child{margin-top:0}
.replybar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--rule-2);border-radius:12px;padding:8px 10px;margin-top:8px}
.replybar-body{flex:1;min-width:0}
.replybar-name{display:block;font-size:11px;font-weight:600;opacity:.7}
.replybar-snip{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.replybar-x{width:24px;height:24px;border-radius:50%;background:var(--rule-2);flex:none;display:grid;place-items:center;font-size:11px}
.chatimgprev{position:relative;width:84px;margin-top:8px}
.chatimgprev img{width:84px;height:84px;object-fit:cover;border-radius:10px;display:block}
.chatimgprev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center;line-height:1}
.chatinput{display:flex;gap:8px;position:sticky;bottom:0;background:var(--paper-2);padding-top:8px}
.chatinput input{flex:1;padding:12px 14px;border-radius:22px;border:1px solid var(--rule);background:var(--card)}
.chatinput button{width:42px;height:42px;border-radius:50%;background:var(--stamp);color:#fff;flex:none;display:grid;place-items:center}
.attachbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--rule-2);flex:none;display:grid;place-items:center;cursor:pointer}
.attachbtn svg{width:18px;height:18px}

/* calendar */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calday{aspect-ratio:1;border-radius:9px;border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;background:var(--card);gap:2px}
.calday b{font-size:14px;font-family:'Bricolage Grotesque',sans-serif}
.calday[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.uploadbox{border:1.5px dashed var(--rule);border-radius:13px;padding:22px 16px;text-align:center;color:var(--ink-3);width:100%}
.uploadbox.done{border-style:solid;border-color:var(--stamp);color:var(--stamp);background:var(--stamp-soft)}
.piclabel{display:block;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.picrow{display:flex;gap:16px;align-items:center}
.picprev{width:92px;height:92px;flex:none;border-radius:50%;border:1.5px dashed var(--rule);display:grid;place-items:center;color:var(--ink-3);overflow:hidden;background:var(--card);font-size:11px;text-align:center}
.picprev svg{width:30px;height:30px}
.picprev.has{border-style:solid;border-color:var(--stamp)}
.picprev img{width:100%;height:100%;object-fit:cover;display:block}
.picbtns{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.picbtn{cursor:pointer;width:100%}
.picbtns .btn.quiet{padding:6px 0;width:auto;align-self:flex-start}

.statuschip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.statuschip.open{background:var(--clay-soft);color:var(--clay)}
.statuschip.resolved{background:var(--stamp-soft);color:var(--stamp)}
.statuschip.wait{background:var(--khaki-soft);color:var(--ink-2)}

/* App hidden initially */
#appRoot {
  display: none;
}
#appRoot.visible {
  display: block;
}
</style>
</head>

<!-- ===== INTRO ANIMATION OVERLAY ===== -->
<div id="introScreen" class="intro-run">
  <div class="intro-stage">
    <div class="intro-iconwrap">
      <div class="intro-pulse"></div>
      <svg class="intro-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TrustMe seal icon" fill="none" stroke="currentColor">
        <g class="intro-thud">
          <g transform="translate(256,256) rotate(-8)">
            <circle class="intro-mark" style="--d:.7s;--t:.9s" pathLength="1" r="176" stroke-width="10"/>
            <circle class="intro-dots" r="176" stroke-width="10" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.55"/>
            <circle class="intro-inner" r="150" stroke-width="3" opacity="0.4"/>
            <path class="intro-mark" style="--d:1.5s;--t:.5s" pathLength="1" d="M -62 4 L -14 52 L 70 -56" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
          </g>

function toggleTheme(){
  const cur=document.documentElement.dataset.theme;
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;

  document.documentElement.dataset.theme=next;

}

  if(S.query && S.query.trim()){
    const q=S.query.trim().toLowerCase();
    list = list.filter(v=>{
      const c=cat(v.cat);
      return v.nm.toLowerCase().includes(q) || v.trade.toLowerCase().includes(q) ||
        v.area.toLowerCase().includes(q) || (c&&c.nm.toLowerCase().includes(q)) ||
        v.pkgs.some(p=>p.nm.toLowerCase().includes(q));
    });
  }
  if(S.comesToMe) list = list.filter(v=>v.home);
  if(S.freeToday) list = list.filter(v=>v.today);
  if(S.topRated) list = [...list].sort((a,b)=>b.rate-a.rate);

}

async function shrinkPhoto(file,opt){
  opt=opt||{};
  const max=opt.max||1280, q=opt.q||0.82, square=!!opt.square;
  if(file.type && !/^image\//i.test(file.type)) throw new Error('not an image');
  let src=null, bmp=null, url=null, w=0, h=0;
  try{
    if(window.createImageBitmap){
      try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
      catch(e){ try{ bmp=await createImageBitmap(file); }catch(e2){ bmp=null; } }
    }
    if(bmp){ src=bmp; w=bmp.width; h=bmp.height; }
    else{
      url=URL.createObjectURL(file);
      const img=new Image();
      await new Promise((ok,no)=>{ img.onload=ok; img.onerror=()=>no(new Error('decode')); img.src=url; });
      src=img; w=img.naturalWidth; h=img.naturalHeight;
    }
    if(!w||!h) throw new Error('empty image');
    const c=document.createElement('canvas'), x=c.getContext('2d');
    if(square){
      const side=Math.min(w,h), out=Math.min(side,max);
      c.width=c.height=out;
      x.fillStyle='#fff'; x.fillRect(0,0,out,out);
      x.drawImage(src,(w-side)/2,(h-side)/2,side,side,0,0,out,out);
    } else {
      const k=Math.min(1,max/Math.max(w,h));
      c.width=Math.max(1,Math.round(w*k)); c.height=Math.max(1,Math.round(h*k));
      x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
      x.drawImage(src,0,0,c.width,c.height);
    }
    const data=c.toDataURL('image/jpeg',q);
    c.width=c.height=0;
    if(data.length<100) throw new Error('encode');
    return data;
  } finally {
    if(bmp&&bmp.close) bmp.close();
    if(url) URL.revokeObjectURL(url);
  }
}

/* Some phones close the page while the camera is open (they need the memory for the camera app),
   and when you come back the page starts again from the top. So just before the camera opens we
   save where you are, and if the page comes back reloaded we put you straight back there. */
function armResume(){
  try{
    sessionStorage.setItem('tm-snap',JSON.stringify({t:Date.now(),PK:PK,S:Object.assign({},S,{toast:null}),V:V}));
    sessionStorage.setItem('tm-resume','1');
  }catch(e){}
}
function disarmResume(){ try{ sessionStorage.removeItem('tm-resume'); sessionStorage.removeItem('tm-snap'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') setTimeout(disarmResume,2500); });

/* The profile picture lives in View profile > Edit profile. S.pic feeds the You tab,
   and the vendor's own listing carries the same photo so corps members see it in search. */
function syncMyPhoto(){ const v=S.myVendorId?V.find(x=>x.id===S.myVendorId):null; if(v) v.photo=S.pic||null; }
async function editPic(el){
  const fl=el.files&&el.files[0];
  disarmResume();
  if(!fl) return;
  S.picBusy=true; S.picErr=''; render();
  try{ S.pic=await shrinkPhoto(fl,{max:640,square:true,q:0.86}); syncMyPhoto(); }
  catch(e){ S.picErr='That photo would not open. Please try another one.'; }
  S.picBusy=false; render();
}
function editPicRemove(){ S.pic=null; S.picErr=''; syncMyPhoto(); render(); }

  const b=$('btn-phone');

}

function syncVendor(){

function pickNeed(id){ S.needs = S.needs.includes(id) ? S.needs.filter(n=>n!==id) : S.needs.concat(id); render(); }
function otpHop(el,i){ const boxes=[...document.querySelectorAll('.otp input')]; if(el.value && i<boxes.length-1) boxes[i+1].focus(); }
function otpBack(e,el,i){ if(e.key==='Backspace' && !el.value && i>0){ const boxes=[...document.querySelectorAll('.otp input')]; boxes[i-1].focus(); } }
function next(){ const steps=onbSteps(); if(S.step<steps.length-1){S.step++;render();$('view').scrollTop=0;} else finish(); }

function finish(){
  if(S.role==='vendor' && !S.myVendorId){
    const c=cat(S.vCat);
    const nv={
      id:S.uid?idn(S.uid):Date.now(), nm:S.name||'New vendor', cat:S.vCat, cats:[S.vCat], trade:c?c.nm:'Services',
      area:S.camp.split(' — ')[1]||S.camp, km:0.3,
      jobs:0, rate:0, since:S.batch+', '+(new Date().getFullYear()),
      score:38, home:false, today:false, verified:false, disputes:0,
      ver:['ID submitted','Photo attached','Awaiting physical check (due within 14 days)'],
      pkgs:[{id:nid(),nm:S.vPkgName.trim(),price:pn(S.vPkgFee),desc:'',dur:''}], revs:[]
    };
    V.unshift(nv); S.myVendorId=nv.id;
  }
  if(TOKEN && !S.hasPin){ S.pinFlow='onboard'; S.pinForm={a:'',b:'',old:'',err:'',busy:false}; S.screen='setpin'; render(); return; }
  S.screen='app'; S.tab='home'; render();
  toast(S.role==='vendor' ? 'You are listed with a pending badge. We visit within 14 days.' : 'You are in. '+supply().length+' vendors near '+S.camp.split(' — ')[1]+'.');
}

/* ============ LOGIN PIN ============
   Opens the app on this phone. Kept separate from the phone OTP: if the phone (and SIM) is stolen,
   the PIN is the one thing the thief does not automatically have. */
function scrSetPin(){
  const f=S.pinForm, changing=S.pinFlow==='change';
  return `
  <div class="hdr">${changing?`<button class="back" onclick="S.pinFlow=null;S.tab='me';go('app')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`:''}<h2>${changing?'Change your login PIN':'Create a login PIN'}</h2></div>
  <p class="lede" style="margin:8px 0 18px">${changing?'Enter your current PIN, then choose a new one.':'A 4-digit PIN to open Trust Me on this phone. If it is ever lost or stolen, this keeps your account out of reach.'}</p>
  ${changing?`<label class="field"><span>Current PIN</span><input type="password" inputmode="numeric" maxlength="4" value="${esc(f.old||'')}" oninput="S.pinForm.old=this.value.replace(/\\D/g,'')"></label>`:''}
  <label class="field"><span>${changing?'New 4-digit PIN':'Choose a 4-digit PIN'}</span>
    <input type="password" inputmode="numeric" maxlength="4" value="${esc(f.a)}" oninput="S.pinForm.a=this.value.replace(/\\D/g,'')"></label>
  <label class="field"><span>Confirm PIN</span>
    <input type="password" inputmode="numeric" maxlength="4" value="${esc(f.b)}" oninput="S.pinForm.b=this.value.replace(/\\D/g,'')"></label>
  ${f.err?`<p class="tiny" style="color:var(--clay);margin:-6px 0 12px">${esc(f.err)}</p>`:''}
  ${f.busy?'<button class="btn" disabled>Saving…</button>':'<button class="btn stamp" onclick="submitSetPin()">Save PIN</button>'}
  ${changing?'':'<p class="tiny" style="margin:12px 0 0">You will need this PIN whenever you reopen the app.</p>'}`;
}
async function submitSetPin(){
  const f=S.pinForm, changing=S.pinFlow==='change';
  if(changing && !/^\d{4}$/.test(f.old||'')){ f.err='Enter your current PIN.'; render(); return; }
  if(!/^\d{4}$/.test(f.a)){ f.err='Enter a 4-digit PIN.'; render(); return; }
  if(f.a!==f.b){ f.err='The PINs do not match.'; render(); return; }
  f.busy=true; f.err=''; render();
  const body={pin:f.a}; if(changing) body.oldPin=f.old;
  const r=await tmApi('POST','/auth/pin',body); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not save the PIN. Try again.'; render(); return; }
  S.hasPin=true; unlocked=true; const flow=S.pinFlow; S.pinFlow=null; S.pinForm={a:'',b:'',old:'',err:'',busy:false};
  if(changing){ S.tab='me'; go('app'); toast('PIN updated.'); return; }
  S.screen='app'; S.tab='home'; render();
  toast(flow==='onboard'
    ? (S.role==='vendor' ? 'You are listed with a pending badge. We visit within 14 days.' : 'You are in. '+supply().length+' vendors near '+S.camp.split(' — ')[1]+'.')
    : 'Welcome back'+(S.name?', '+S.name.split(' ')[0]:'')+'. Your PIN is saved.');
}
function scrLock(){
  return `
  <div class="hdr"><h2>Enter your PIN</h2></div>
  <p class="lede" style="margin:8px 0 18px">to open Trust Me${S.name?', '+esc(S.name.split(' ')[0]):''}.</p>
  <label class="field"><span>4-digit PIN</span>
    <input id="f-lockpin" type="password" inputmode="numeric" maxlength="4" value="${esc(S.lockPin||'')}" oninput="S.lockPin=this.value.replace(/\\D/g,'')" onkeydown="if(event.key==='Enter')submitLockPin()" autofocus></label>
  ${S.lockErr?`<p class="tiny" style="color:var(--clay);margin:-6px 0 12px">${esc(S.lockErr)}</p>`:''}
  ${S.lockBusy?'<button class="btn" disabled>Checking…</button>':'<button class="btn stamp" onclick="submitLockPin()">Unlock</button>'}
  <button class="btn quiet" style="margin-top:10px" onclick="resetPrForm();S.screen='pinreset';render()">Forgot your PIN?</button>`;
}
async function submitLockPin(){
  if(!/^\d{4}$/.test(S.lockPin||'')){ S.lockErr='Enter your 4-digit PIN.'; render(); return; }
  S.lockBusy=true; S.lockErr=''; render();
  const r=await tmApi('POST','/auth/pin/verify',{pin:S.lockPin}); S.lockBusy=false;
  if(!r.ok){ S.lockErr=r.j.error||'Wrong PIN.'; S.lockPin=''; render(); return; }
  unlocked=true; S.lockPin=''; S.screen='app'; S.tab='home'; render();
  toast('Welcome back'+(S.name?', '+S.name.split(' ')[0]:'')+'.');
}
function resetPrForm(){ S.prForm={code:'',devCode:'',a:'',b:'',err:'',busy:false,sent:false}; }
function scrPinReset(){
  const f=S.prForm;
  return `
  <div class="hdr"><button class="back" onclick="S.screen='lock';render()" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>Reset your PIN</h2></div>
  <p class="lede" style="margin:8px 0 18px">We text a code to ${esc(S.phone||'your registered number')} to confirm it is you.</p>
  ${!f.sent
    ?(f.busy?'<button class="btn" disabled>Sending…</button>':'<button class="btn stamp" onclick="sendPinResetOtp()">Send me a code</button>')
    :`<label class="field"><span>Code sent to your phone</span><input inputmode="numeric" maxlength="6" value="${esc(f.code)}" oninput="S.prForm.code=this.value"></label>
    ${f.devCode?`<p class="small" style="margin:-6px 0 14px">Test mode: your code is <b class="num">${esc(f.devCode)}</b></p>`:''}
    <label class="field"><span>New 4-digit PIN</span><input type="password" inputmode="numeric" maxlength="4" value="${esc(f.a)}" oninput="S.prForm.a=this.value.replace(/\\D/g,'')"></label>
    <label class="field"><span>Confirm new PIN</span><input type="password" inputmode="numeric" maxlength="4" value="${esc(f.b)}" oninput="S.prForm.b=this.value.replace(/\\D/g,'')"></label>
    ${f.err?`<p class="tiny" style="color:var(--clay);margin:-6px 0 12px">${esc(f.err)}</p>`:''}
    ${f.busy?'<button class="btn" disabled>Saving…</button>':'<button class="btn stamp" onclick="submitPinReset()">Save new PIN</button>'}
    <button class="btn quiet" onclick="sendPinResetOtp()">Send a new code</button>`}`;
}
async function sendPinResetOtp(){
  const f=S.prForm; f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/auth/request-otp',{phone:S.phone}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not send the code.'; render(); return; }
  f.sent=true; f.code=''; f.devCode=r.j.devCode||''; render();
}
async function submitPinReset(){
  const f=S.prForm;
  if(!/^\d{4,6}$/.test(f.code.trim())){ f.err='Enter the code.'; render(); return; }
  if(!/^\d{4}$/.test(f.a)){ f.err='Enter a 4-digit PIN.'; render(); return; }
  if(f.a!==f.b){ f.err='The PINs do not match.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/auth/pin/reset',{phone:S.phone,code:f.code.trim(),pin:f.a}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not reset the PIN. Try again.'; render(); return; }
  if(r.j.token){ TOKEN=r.j.token; try{ localStorage.setItem('tm-token',TOKEN); }catch(e){} }
  S.hasPin=true; unlocked=true; resetPrForm();

/* Swipe a message bubble right to quote it in a reply — delegated on document since #view is
   rebuilt on every render(). Works with touch, mouse and pen (Pointer Events). */
let swEl=null, swX=0, swY=0, swDX=0, swIdx=-1, swActive=false;
function endSwipe(commit){
  if(!swEl) return;
  const el=swEl, idx=swIdx, arm=swDX>40;
  el.style.transition='transform .18s ease'; el.style.transform='translateX(0)'; el.classList.remove('armed');
  setTimeout(()=>{ if(el) el.style.transition=''; },200);
  swEl=null; swActive=false;
  if(commit&&arm&&idx>=0) beginReplyAt(idx);
}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('.chatwrap .bubble'); if(!b) return;
  swEl=b; swX=e.clientX; swY=e.clientY; swDX=0; swActive=false; swIdx=+b.dataset.idx;
});
document.addEventListener('pointermove',e=>{
  if(!swEl) return;
  const dx=e.clientX-swX, dy=e.clientY-swY;
  if(!swActive){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return; if(Math.abs(dy)>Math.abs(dx)){ swEl=null; return; } swActive=true; e.preventDefault(); }
  swDX=Math.max(0,Math.min(dx,64));
  swEl.style.transform='translateX('+swDX+'px)';
  swEl.classList.toggle('armed',swDX>40);
});
document.addEventListener('pointerup',()=>endSwipe(true));
document.addEventListener('pointercancel',()=>endSwipe(false));

function pickWhen(i){
  if(i===3){ S.sheet='datepicker'; render(); return; }
  S.when=i; S.customDate=null; render();
}
function calDays(){
  const days=[];
  const base=new Date();
  for(let i=0;i<14;i++){
    const d=new Date(base); d.setDate(base.getDate()+i);
    days.push(d);
  }
  return days;
}
function pickCustomDate(iso){
  const d=new Date(iso);
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  S.customDate=wd+', '+mo+' '+d.getDate();
  S.when=3; S.sheet=null; render();
}

let booking=false;
async function makeBooking(price){
  if(booking) return;
  if(S.role==='vendor'){ toast('Vendor accounts cannot book. Use a corps member account.'); return; }
  const v=V.find(x=>x.id===S.vendor), pk=pkgById(v,S.pick)||v.pkgs[0];
  const whenLabel = S.when===3 ? (S.customDate||'Pick a date') : WHENS[S.when];
  let b;
  if(v.srv&&TOKEN){          // a real vendor: the booking goes to them through the server
    booking=true; const r=await tmApi('POST','/bookings',{vendorId:v.srv,pkgId:String(pk.id),when:whenLabel,where:WHERES[S.where]}); booking=false;
    if(!r.ok){ toast(r.j.error||'Could not place the booking.'); return; }
    if(r.j.payUrl){ saveProfile(); location.href=r.j.payUrl; return; }        // off to the bank to approve the payment
    b=bFromSrv(r.j); bSig='';
  } else b={id:Date.now(),v:v.id,what:pk.nm,price,stage:1,when:whenLabel,where:WHERES[S.where],rated:false};
  S.bookings.unshift(b); S.booking=b.id; S.screen='job'; render();
  toast(naira(price)+' held. '+v.nm.split(' ')[0]+' has 30 minutes to accept.');
}

  return `<button class="card" style="width:100%;text-align:left" onclick="S.booking=${b.id};go('job')">
    <div class="row">
      ${av(v)}
      <div style="flex:1;min-width:0">

        <p class="tiny" style="margin:4px 0 0;color:var(--stamp)">${label}</p>

}

  </div>
  <div class="chatinput">
    <input id="f-supportmsg" placeholder="Describe what is going on…" onkeydown="if(event.key==='Enter')sendSupportMsg()">
    <button onclick="sendSupportMsg()" aria-label="Send"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></button>
  </div>`;
}
function sendSupportMsg(){
  const el=$('f-supportmsg'); if(!el||!el.value.trim()) return;
  const text=el.value.trim();
  S.supportMsgs.push({from:'me', text});
  render();
  const box=document.querySelector('.chatwrap'); if(box) box.scrollTop=box.scrollHeight;
  setTimeout(()=>{
    S.supportMsgs.push({from:'them', text:'Got it — one moment while I look into that for you.'});
    if(S.screen==='support') render();
  },900);
}

function resolveDispute(id){
  const d=S.disputes.find(x=>x.id===id); if(d) d.status='resolved';
  render(); toast('Marked resolved.');
}

function verRows(v){
  if(v.id===S.myVendorId && !v.verified){ const f=S.vf; return [
    {t:f.ninOk?'NIN verified — name and date of birth match':'NIN not submitted yet',ok:f.ninOk},
    {t:f.photoOk?'Photos match your ID':'Photos matching your ID not added yet',ok:f.photoOk},
    {t:f.payOk?'Work address and bank account received':'Work address and bank account not added yet',ok:f.payOk},
    {t:'Awaiting physical check (due within 14 days)',ok:false}]; }
  return v.ver.map(t=>({t,ok:v.verified}));
}
const myV=()=>V.find(x=>x.id===S.myVendorId);
function openPkg(id){
  const p=id&&myV().pkgs.find(x=>x.id===id);
  S.pkgForm=p?{id:p.id,nm:p.nm,price:String(p.price),desc:p.desc||'',dur:p.dur||'',err:{}}:{id:null,nm:'',price:'',desc:'',dur:'',err:{}};
  S.sheet='pkg'; render();
}
function pkgIdea(k){ const t=PKG_IDEAS[myV().cat][k]; S.pkgForm.nm=t; const i=$('f-pkgnm'); if(i){ i.value=t; i.focus(); } }
function savePkg(){
  const v=myV(), f=S.pkgForm; if(!v||!f) return;
  f.err={};
  if(f.nm.trim().length<2) f.err.nm='Give the package a name.';
  if(!(pn(f.price)>0)) f.err.price='Add the fee in naira.';
  if(Object.keys(f.err).length){ render(); return; }
  const o={id:f.id||nid(),nm:f.nm.trim(),price:pn(f.price),desc:f.desc.trim(),dur:f.dur.trim()};
  const edit=!!f.id;
  v.pkgs = edit ? v.pkgs.map(p=>p.id===f.id?o:p) : v.pkgs.concat(o);
  S.sheet=null; S.pkgForm=null; render();
  toast(edit?'Package updated.':o.nm+' added at '+naira(o.price)+'. It shows on your profile now.');
}
function delPkg(id){ const v=myV(); if(!v||v.pkgs.length<2) return; v.pkgs=v.pkgs.filter(p=>p.id!==id); render(); toast('Package removed.'); }
async function vfPhoto(k,el){
  const fl=el.files&&el.files[0];
  disarmResume();
  if(!fl) return;
  S.vf.err.photo=''; S.vf[k+'Proc']=true; render();
  try{ S.vf[k]=await shrinkPhoto(fl,{max:1280,q:0.82}); }
  catch(e){ S.vf.err.photo='That photo would not open. Please take it again.'; }
  S.vf[k+'Proc']=false; render();
}
function vfSubmit(sec){
  const f=S.vf; f.err={};
  if(sec==='nin'){
    if(!/^\d{11}$/.test(f.nin.replace(/\s/g,''))) f.err.nin='A NIN has 11 digits.';
    if(f.legal.trim().length<3) f.err.legal='Enter your name exactly as it appears on your ID.';
    if(!f.dob) f.err.dob='Add your date of birth.';
  } else if(sec==='photo'){
    if(!f.selfie||!f.idPhoto) f.err.photo='Add both a photo of yourself and a photo of your ID.';
  } else {
    if(f.addr.trim().length<8) f.err.addr='Add the address where you work.';
    if(!f.bank.trim()) f.err.bank='Add your bank.';
    if(!/^\d{10}$/.test(f.acct.replace(/\s/g,''))) f.err.acct='Account numbers have 10 digits.';
  }
  if(Object.keys(f.err).length){ render(); return; }
  f[sec+'Busy']=true; render();
  setTimeout(()=>{ f[sec+'Busy']=false; f[sec+'Ok']=true; render();
    toast({nin:'NIN accepted (simulated).',photo:'Photos accepted — your face matches your ID (simulated).',pay:'Details received. Bank account name matches your ID (simulated).'}[sec]); },1600);
}

function fileDispute(reason){
  const b=S.bookings.find(x=>x.id===S.disputeBookingId);
  if(b){
    const v=vOf(b);
    v.disputes = (v.disputes||0)+1;
    recomputeScore(v);
    const d=new Date();
    const dateLabel=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate();
    S.disputes.unshift({id:Date.now(), vendorId:v.id, bookingId:b.id, reason, status:'open', date:dateLabel});
  }
  S.sheet=null; render();
  toast('Dispute opened. Your money is frozen, not sent. We reply within 48 hours.');
}
async function saveReview(){
  const b=S.bookings.find(x=>x.id===S.reviewFor);
  const txt=($('f-revtext')&&$('f-revtext').value.trim()) || 'Booked through Trust Me.';
  if(b&&b.srv){          // a real vendor: the rating, job count and trust score are worked out on the server
    const r=await tmApi('POST','/bookings/'+b.srv+'/review',{rating:S.rating,text:txt});
    if(!r.ok){ toast(r.j.error||'Could not post the review.'); return; }
    b.rated=true; bSig=''; vSig=''; pullVendors();
  } else if(b){
    b.rated=true;
    const v=vOf(b);
    v.revs.unshift({n:(S.name||'You')+' (you)', s:S.rating, t:txt, w:naira(b.price)+' · '+b.what});
    v.jobs += 1;
    v.rate = Math.round(((v.rate*(v.jobs-1)+S.rating)/v.jobs)*10)/10;
    recomputeScore(v);
  }
  S.sheet=null; render(); toast('Review posted with your receipt attached. It shows on their profile.');
}

  if(!TOKEN||!synced||S.role!=='vendor') return;
  const r=await tmApi('GET','/wallet'); if(!r.ok) return;

    <button class="btn sm ghost" onclick="openWPinChange()">Change</button></div></div>`:''}
  <div class="card" style="margin-top:12px"><div class="spread"><span class="small">Earned in total</span><span class="pricepill">${naira(w.earned)}</span></div>
    <div class="spread" style="margin-top:8px"><span class="small">Withdrawn</span><span class="pricepill">${naira(w.withdrawn)}</span></div>
    <p class="tiny" style="margin:8px 0 0">Each job is paid after the 8% service fee.</p></div>
  <h3 style="margin:20px 0 8px">History</h3>
  <div class="stack">${w.history.length?w.history.map(h=>h.kind==='earning'
    ?`<div class="card"><div class="spread"><div><h3 style="font-size:14px">${esc(h.what)}</h3><p class="tiny" style="margin:2px 0 0">Job paid · ${dlabel(h.at)}</p></div><span class="pricepill" style="color:var(--stamp)">+${naira(h.amt)}</span></div></div>`
    :`<div class="card"><div class="spread"><div><h3 style="font-size:14px">Withdrawal</h3><p class="tiny" style="margin:2px 0 0">${esc(h.to)} · ${dlabel(h.at)}</p></div><div style="text-align:right"><span class="pricepill">−${naira(h.amt)}</span><div style="margin-top:4px">${chip(h)}</div></div></div></div>`
  ).join(''):`<div class="empty"><h3>Nothing yet</h3><p class="small" style="margin:8px auto 0;max-width:28ch">Your earnings show up here after each finished job.</p></div>`}</div>`;
}
function resetWForm(){ S.wForm={amt:'',bank:'',acct:'',code:'',sent:false,devCode:'',busy:false,err:'',pin:'',pinA:'',pinB:'',oldPin:''}; }
function openWithdraw(){ resetWForm(); S.sheet='withdraw'; render(); }
function openWPinChange(){ resetWForm(); S.sheet='wpin'; render(); }
async function openBank(){
  resetWForm(); S.sheet='bank'; render();
  if(!S.banks){ const r=await tmApi('GET','/banks'); if(r.ok){ S.banks=r.j; if(S.sheet==='bank') render(); } else { S.wForm.err=r.j.error||'Could not load the banks.'; render(); } }
}
async function doWithdraw(){
  const f=S.wForm, amt=Math.floor(+String(f.amt).replace(/[^\d]/g,''));
  if(!(amt>0)){ f.err='Enter how much to withdraw.'; render(); return; }
  if(!/^\d{4}$/.test(f.pin)){ f.err='Enter your 4-digit withdrawal PIN.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/wallet/withdraw',{amount:amt,pin:f.pin}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not withdraw. Try again.'; f.pin=''; if(r.s===0||r.s===502) pullWallet(); render(); return; }
  S.wallet=r.j; wSig=JSON.stringify(r.j); S.sheet=null; render();
  const p=r.j.history.find(h=>h.kind==='payout');
  toast(p&&p.status==='success'?naira(amt)+(r.j.live?' has been sent to your bank.':' withdrawn (test mode).'):naira(amt)+' is on its way to your bank.',3600);
}
async function setupWPin(){
  const f=S.wForm;
  if(!/^\d{4}$/.test(f.pinA)){ f.err='Enter a 4-digit PIN.'; render(); return; }
  if(f.pinA!==f.pinB){ f.err='The PINs do not match.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/wallet/pin',{pin:f.pinA}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not save the PIN. Try again.'; render(); return; }
  S.wallet=r.j; wSig=JSON.stringify(r.j); f.pinA=''; f.pinB=''; f.err=''; render();
  toast('Withdrawal PIN saved. Enter it whenever you withdraw.');
}
async function changeWPin(){
  const f=S.wForm;
  if(!/^\d{4}$/.test(f.oldPin)){ f.err='Enter your current PIN.'; render(); return; }
  if(!/^\d{4}$/.test(f.pinA)){ f.err='Enter a 4-digit PIN.'; render(); return; }
  if(f.pinA!==f.pinB){ f.err='The PINs do not match.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/wallet/pin',{pin:f.pinA,oldPin:f.oldPin}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not change the PIN. Try again.'; render(); return; }
  S.wallet=r.j; wSig=JSON.stringify(r.j); S.sheet=null; render();
  toast('Withdrawal PIN updated.');
}
async function sendBankCode(){
  const f=S.wForm, acct=f.acct.replace(/\s/g,'');
  if(!f.bank){ f.err='Choose your bank.'; render(); return; }
  if(!/^\d{10}$/.test(acct)){ f.err='Enter the 10-digit account number.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('POST','/wallet/bank/otp'); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not send the code.'; render(); return; }
  f.sent=true; f.code=''; f.devCode=r.j.devCode||''; render();
}
async function saveBank(){
  const f=S.wForm;
  if(!/^\d{6}$/.test(f.code.trim())){ f.err='Enter the 6-digit code.'; render(); return; }
  f.busy=true; f.err=''; render();
  const r=await tmApi('PUT','/wallet/bank',{bank:f.bank,account:f.acct.replace(/\s/g,''),code:f.code.trim()}); f.busy=false;
  if(!r.ok){ f.err=r.j.error||'Could not save the account.'; render(); return; }
  S.wallet=r.j; wSig=JSON.stringify(r.j); S.sheet=null; render(); toast('Payout account saved: '+r.j.bank.name+'.',3200);
}

/* ============ SAVED PROFILE ============
   The profile is kept in this browser (localStorage) so it is still here after the app is closed and reopened.
   Only this device has it. ID photos, the full NIN and the full account number are never written to storage:
   we keep the accepted/not-accepted state plus the last digits the screen shows. */
const SAVE_KEY='tm-profile-v1';
const SAVE_FIELDS=['name','phone','role','camp','batch','stream','needs','notif','bio','phase','day','vCat','vPkgName','vPkgFee','pic','myVendorId','bookings','messages','disputes','supportMsgs','tab','step','uid'];
let saveTimer=null, wiped=false;
function snapshotProfile(){
  const o={}; SAVE_FIELDS.forEach(k=>{ o[k]=S[k]; });
  o.screen=(S.screen==='welcome'||S.screen==='onb')?S.screen:'app';
  const f=S.vf, sv={ninOk:!!f.ninOk,photoOk:!!f.photoOk,payOk:!!f.payOk};
  if(f.ninOk){ sv.nin=String(f.nin).replace(/\s/g,'').slice(-2); sv.legal=f.legal; }
  if(f.payOk){ sv.addr=f.addr; sv.bank=f.bank; sv.acct=String(f.acct).replace(/\s/g,'').slice(-4); }
  o.vf=sv;
  const mine=S.myVendorId?V.find(x=>x.id===S.myVendorId):null;
  return {v:1, PK:PK, S:o, mine:mine?Object.assign({},mine,{photo:null}):null};
}
function saveProfile(){
  if(wiped) return;
  try{
    const snap=snapshotProfile();
    try{ localStorage.setItem(SAVE_KEY,JSON.stringify(snap)); }
    catch(e){ snap.S.pic=null; localStorage.setItem(SAVE_KEY,JSON.stringify(snap)); }
  }catch(e){}
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveProfile,250); pushMe(); }
function restoreProfile(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||d.v!==1||!d.S) return false;
    const s=d.S;
    if(s.myVendorId && !d.mine) return false;
    SAVE_FIELDS.forEach(k=>{ if(s[k]!==undefined) S[k]=s[k]; });
    S.screen = (s.screen==='onb'||s.screen==='welcome') ? s.screen : 'app';
    S.tab = (s.tab==='book'||s.tab==='me') ? s.tab : 'home';
    if(s.vf) Object.assign(S.vf,s.vf);
    if(d.mine){ const i=V.findIndex(x=>x.id===d.mine.id); if(i>=0) V[i]=Object.assign(V[i],d.mine); else V.unshift(d.mine); }
    PK=Math.max(PK,d.PK||0);
    syncMyPhoto();
    return true;
  }catch(e){ return false; }
}
function signOut(){
  if(!confirm('Sign out and clear the profile saved on this device?')) return;
  wiped=true; clearTimeout(saveTimer);
  try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem('tm-token'); }catch(e){}
  disarmResume();
  location.reload();
}
document.addEventListener('input',queueSave);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveProfile(); });
window.addEventListener('pagehide',saveProfile);

/* ============ SERVER SYNC ============
   Accounts, profiles and vendor listings live on the server so they work on every device.
   Bookings and messages are still kept on the device only. */
let PAYLIVE=false;
const payRef=new URLSearchParams(location.search).get('reference');
let TOKEN=null; try{ TOKEN=localStorage.getItem('tm-token'); }catch(e){}
let unlocked=false;   // login-PIN gate for this browser session — reset to false on every fresh page load
let synced=false, pushSig='', pushT=null, vSig='';
const idn=id=>parseInt(id,16);
async function tmApi(m,p,b){
  try{
    const r=await fetch('/api'+p,{method:m,headers:Object.assign({'Content-Type':'application/json'},TOKEN?{Authorization:'Bearer '+TOKEN}:{}),body:b?JSON.stringify(b):undefined});
    const j=await r.json().catch(()=>({}));
    if(r.status===401&&TOKEN){ TOKEN=null; synced=false; try{ localStorage.removeItem('tm-token'); }catch(e){} }
    return {ok:r.ok,s:r.status,j};
  }catch(e){ return {ok:false,s:0,j:{error:'No connection.'}}; }
}
function fromSrv(u){   // server vendor -> the shape the app already uses (text escaped, the app prints it as HTML)
  const c=cat(u.cat);
  const o={id:idn(u.id),srv:u.id,nm:esc(u.name||'Vendor'),cat:u.cat,cats:[u.cat],trade:c?c.nm:'Services',
    area:esc((u.camp||'').split(' — ')[1]||u.camp||''),km:0.5,jobs:u.jobs||0,rate:u.rate||0,since:esc((u.batch||'')+', '+new Date().getFullYear()),
    score:u.verified?80:38,home:false,today:false,verified:!!u.verified,disputes:0,
    ver:u.verified?['ID checked']:['ID submitted','Photo attached','Awaiting physical check (due within 14 days)'],
    pkgs:(u.pkgs||[]).map(p=>({id:Number(p.id)||idn(p.id),nm:esc(p.nm),price:p.price,desc:esc(p.desc||''),dur:esc(p.dur||'')})),revs:(u.revs||[]).map(r=>({n:esc(r.n),s:r.s,t:esc(r.t),w:esc(r.w)})),photo:u.pic||null,callPhone:u.callPhone||''};
  if(o.rate) recomputeScore(o);
  return o;
}
async function pullVendors(){
  if(!TOKEN) return;
  const r=await tmApi('GET','/vendors'); if(!r.ok) return;
  const sig=JSON.stringify(r.j)+S.myVendorId; if(sig===vSig) return; vSig=sig;
  for(let i=V.length-1;i>=0;i--) if(V[i].srv) V.splice(i,1);
  r.j.forEach(u=>{
    if(idn(u.id)===S.myVendorId){ const m=V.find(x=>x.id===S.myVendorId), f=fromSrv(u); if(m){ m.jobs=f.jobs; if(f.revs.length) Object.assign(m,{rate:f.rate,revs:f.revs,score:f.score}); } return; } const v=fromSrv(u); v.pkgs.forEach(p=>{ PK=Math.max(PK,p.id); }); V.unshift(v); });
  render();
}
async function pullMe(){
  if(!TOKEN) return false;
  const r=await tmApi('GET','/me'); if(!r.ok) return false;
  const u=r.j; S.uid=u.id; S.hasPin=!!u.hasPin;
  if(!u.setup){
    Object.assign(S,{name:u.name||S.name,camp:u.camp||S.camp,batch:u.batch||S.batch,stream:u.stream||'',needs:u.needs||[],role:u.role,pic:u.pic||null});
    if(u.role==='vendor'){
      const v=fromSrv(u); delete v.srv; v.nm=u.name||'Vendor'; v.area=(u.camp||'').split(' — ')[1]||u.camp||''; v.since=(u.batch||'')+', '+new Date().getFullYear();
      v.pkgs.forEach(p=>{ PK=Math.max(PK,p.id); }); const i=V.findIndex(x=>x.id===v.id);
      if(i>=0) Object.assign(V[i],{pkgs:v.pkgs,cat:v.cat,cats:v.cats,trade:v.trade,nm:v.nm,area:v.area,callPhone:v.callPhone}); else V.unshift(v);
      S.myVendorId=v.id; syncMyPhoto();
    }
    if(S.screen==='welcome'||S.screen==='onb'){
      S.tab='home';
      if(!u.hasPin){ S.pinFlow='return'; S.pinForm={a:'',b:'',old:'',err:'',busy:false}; S.screen='setpin'; }
      else if(!unlocked){ S.screen='lock'; }
      else { S.screen='app'; toast('Welcome back'+(u.name?', '+esc(u.name.split(' ')[0]):'')+'.'); }
    }
  }
  synced=true; render(); return !u.setup;
}
function pushMe(){
  clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    if(!TOKEN||!synced||wiped||S.screen==='welcome') return;
    const done=S.screen!=='onb', b={name:S.name,camp:S.camp,batch:S.batch,stream:S.stream||'',needs:S.needs,pic:S.pic||null,role:S.role,done};
    if(S.role==='vendor'&&done){ const v=myV(); if(v){ b.cat=v.cat; b.pkgs=v.pkgs.map(p=>({id:p.id,nm:p.nm,price:p.price,desc:p.desc||'',dur:p.dur||''})); b.callPhone=v.callPhone||''; } }
    const sig=JSON.stringify(b); if(sig===pushSig) return;
    const r=await tmApi('PATCH','/me',b); if(r.ok) pushSig=sig;
  },1200);
}
async function sendOtp(again){
  const r=await tmApi('POST','/auth/request-otp',{phone:S.phone});
  if(r.ok){ S.devCode=r.j.devCode||''; if(again){ toast('New code sent.'); render(); } else next(); }
  else if(r.s===0){ S.devCode=''; if(!again) next(); }        // no server reachable: carry on on this device only
  else toast(r.j.error||'Could not send the code.');
}
async function verifyOtp(){
  if(!S.devCode&&!TOKEN){ next(); return; }                       // offline mode
  const code=[...document.querySelectorAll('.otp input')].map(i=>i.value).join('');
  const r=await tmApi('POST','/auth/verify',{phone:S.phone,code});
  if(!r.ok){ toast(r.j.error||'That code did not work.'); return; }
  TOKEN=r.j.token; try{ localStorage.setItem('tm-token',TOKEN); }catch(e){}
  S.uid=r.j.user.id; S.devCode='';
  if(r.j.user.setup){ synced=true; next(); } else { await pullMe(); pullVendors(); pullBookings(); pullMessages(); pullWallet(); }
}
/* bookings: the corps member and the vendor each move their own steps, and both see the same booking */
let bSig='';
const cpOf=b=>({id:b.cid,nm:b.cname,photo:b.cpic,verified:true});
const vOf=b=>(S.role==='vendor'&&b.srv)?cpOf(b):(V.find(x=>x.id===b.v)||fromSrv(b.vd));
function bFromSrv(b,old){
  return {id:idn(b.id),srv:b.id,v:idn(b.vendorId),vd:b.vendor,cid:idn(b.corperId),cname:esc(b.corper.name||'Corps member'),cpic:b.corper.pic||null,
    what:esc(b.what),price:b.price,stage:b.stage,when:esc(b.when),where:esc(b.where),rated:!!b.rated||!!(old&&old.rated)};
}
async function pullBookings(){
  if(!TOKEN||!synced) return;
  const r=await tmApi('GET','/bookings'); if(!r.ok) return;
  const sig=JSON.stringify(r.j); if(sig===bSig) return; bSig=sig;
  const prev={}; S.bookings.forEach(b=>{ if(b.srv) prev[b.srv]=b; });
  r.j=r.j.filter(b=>b.stage>0);
  r.j.forEach(b=>{ PEERS[idn(b.corperId)]={id:idn(b.corperId),nm:esc(b.corper.name||'Corps member'),photo:b.corper.pic||null,srv:b.corperId,verified:true}; });
  S.bookings=r.j.map(b=>bFromSrv(b,prev[b.id])).concat(S.bookings.filter(b=>!b.srv));
  if(!S.sheet) render();
}
async function stepBooking(id,msg){
  const b=S.bookings.find(x=>x.id===id); if(!b) return;
  if(!b.srv){ b.stage++; render(); toast(msg); return; }
  const r=await tmApi('POST','/bookings/'+b.srv+'/advance');
  if(!r.ok){ toast(r.j.error||'Could not update the booking.'); bSig=''; pullBookings(); return; }
  b.stage=r.j.stage; bSig=''; render(); toast(msg);
}
function scrVendorJob(b){
  const st=b.stage, cp=cpOf(b), first=(b.cname||'They').split(' ')[0], net=Math.round(b.price*0.92);
  const dot=i=>`<span class="dot ${st>i?'done':st===i?'now':''}"></span>`, bar=i=>`<span class="bar ${st>i?'done':''}"></span>`;
  return `
  <div class="hdr"><button class="back" onclick="go('app')" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>${b.what}</h2></div>
  <div class="card">
    <div class="row">${av(cp)}<div style="flex:1"><h3 style="font-size:15px">${cp.nm}</h3><p class="tiny" style="margin:2px 0 0">${b.when} · ${b.where}</p></div></div>
    <div class="divide"></div>
    <div class="esc">${dot(1)}${bar(1)}${dot(2)}${bar(2)}${dot(3)}${bar(3)}${dot(4)}</div>
    <div class="esclabels"><span>Booked</span><span>Accepted</span><span>Work done</span><span>Received</span></div>
    <div class="divide"></div>
    <div class="spread"><span class="small">${st<4?'Held for you':'You received'}</span><span class="pricepill">${naira(st<4?b.price:net)}</span></div>
  </div>
  ${st===1?`<div class="card" style="margin-top:12px"><p class="small" style="margin:0">${first} has booked you and the money is already held. Accept within 30 minutes or it goes back to them.</p></div>
    <div style="margin-top:14px"><button class="btn stamp" onclick="stepBooking(${b.id},'Accepted. Head over when it is time.')">Accept booking</button></div>`:''}
  ${st===2?`<div class="card" style="margin-top:12px"><p class="small" style="margin:0">Go to ${b.where}. When the work is done, tap the button so ${first} can confirm it.</p></div>
    <div style="margin-top:14px"><button class="btn stamp" onclick="stepBooking(${b.id},'Marked as finished. Waiting for them to confirm.')">Work finished</button></div>`:''}
  ${st===3?`<div class="card" style="margin-top:12px"><p class="small" style="margin:0">Waiting for ${first} to confirm the work. The money stays safe with Trust Me until they do.</p></div>`:''}
  ${st<4?`<div style="margin-top:10px"><button class="btn ghost" onclick="openVendorChat(${b.cid})">Message ${first}</button></div>`:''}
  ${st===4?`<div class="card" style="margin-top:12px"><div class="spread"><span class="small">Received through Trust Me</span><span class="pricepill">${naira(net)}</span></div><div class="spread" style="margin-top:8px"><span class="small">Scam losses</span><span class="pricepill">${naira(0)}</span></div><p class="tiny" style="margin:8px 0 0">After the 8% service fee.</p></div>`:''}`;
}
const PEERS={};
const peerOf=id=>V.find(x=>x.id===id)||PEERS[id];
const lbl=ms=>{ const d=new Date(ms); return (d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0'); };
async function pullMessages(){
  if(!TOKEN||!synced) return;
  const r=await tmApi('GET','/messages'); if(!r.ok) return;
  let changed=false;
  for(const t of r.j){
    const id=idn(t.with.id), cur=S.messages[id]||[];
    PEERS[id]={id,nm:esc(t.with.name||'User'),photo:t.with.pic||null,srv:t.with.id,verified:true};
    if(cur.length&&cur[cur.length-1].sid===t.last.id) continue;
    const th=await tmApi('GET','/messages/'+t.with.id); if(!th.ok) continue;
    S.messages[id]=th.j.map(m=>({sid:m.id,from:m.from===S.uid?'me':'them',text:m.text,img:m.img||null,quote:m.quote||null,t:lbl(m.at)})); changed=true;
  }
  if(changed&&!S.sheet){
    const el=$('f-vendormsg'), val=el?el.value:'', had=el&&document.activeElement===el;
    render(); const e2=$('f-vendormsg'); if(e2){ e2.value=val; if(had) e2.focus(); }
  }
}
setInterval(()=>{ if(document.visibilityState==='visible'){ pullBookings(); pullMessages(); pullVendors(); pullWallet(); } },8000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ pullVendors(); pullBookings(); pullMessages(); pullWallet(); } });

let resumed=false;
restoreProfile();
async function finishPayment(){       // back from the bank: confirm the payment, then open the booking
  if(!payRef||!TOKEN) return; history.replaceState(null,'',location.pathname);
  const r=await tmApi('POST','/payments/verify',{reference:payRef});
  if(!r.ok){ toast(r.j.error||'That payment was not completed.'); return; }
  bSig=''; await pullBookings(); const b=S.bookings.find(x=>x.srv===r.j.id);
  if(b){ S.booking=b.id; S.screen='job'; render(); toast(naira(b.price)+' held. '+vOf(b).nm.split(' ')[0]+' has 30 minutes to accept.'); }
}
tmApi('GET','/health').then(r=>{ PAYLIVE=!!(r.j&&r.j.payments); });
pullMe().then(()=>{ pullVendors(); pullBookings(); pullMessages(); pullWallet(); finishPayment(); });
try{
  if(sessionStorage.getItem('tm-resume')==='1'){
    const raw=sessionStorage.getItem('tm-snap');
    disarmResume();
    const snap=raw&&JSON.parse(raw);
    if(snap && Date.now()-snap.t<30*60*1000){
      V.splice(0,V.length,...snap.V);
      PK=Math.max(PK,snap.PK||0);
      Object.assign(S,snap.S,{toast:null});
      resumed=true;
    }
  }
}catch(e){}

loadTheme(); paintToggle();
$('tt').addEventListener('click',toggleTheme);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paintToggle);
(function clock(){
  const d=new Date();
  $('clock').textContent=(d.getHours()%12||12)+':'+String(d.getMinutes()).padStart(2,'0');
  setTimeout(clock,20000);
})();
render();
if(resumed) toast('Your phone closed the page while the camera was open. You are back where you left off. Please add the photo again.',6000);
</script>
